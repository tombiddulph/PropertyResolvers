name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit SemVer version (for example 2.5.0 or 2.5.0-rc.1)'
        required: true
        type: string

concurrency:
  group: propertyresolvers-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Release from main only'; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Invalid version'; exit 1; }
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo 'Version already tagged'; exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Package and Native AOT validation
        shell: pwsh
        run: ./scripts/Test-Package.ps1 -WorkDirectory "$env:RUNNER_TEMP/PropertyResolvers" -PublishAot

      - name: Pack release artifacts
        shell: bash
        run: |
          dotnet pack src/PropertyResolvers.Attributes/PropertyResolvers.Attributes.csproj -c Release -o artifacts "-p:Version=$VERSION" "-p:PackageVersion=$VERSION"
          dotnet pack src/PropertyResolvers.Generators/PropertyResolvers.Generators.csproj -c Release -o artifacts "-p:Version=$VERSION" "-p:PackageVersion=$VERSION"

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ inputs.version }}
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Validate exact release packages
        shell: pwsh
        run: ./scripts/Test-Package.ps1 -WorkDirectory "$env:RUNNER_TEMP/PropertyResolversRelease" -PackageVersion "$env:VERSION" -PackageSource "$env:GITHUB_WORKSPACE/artifacts" -PublishAot

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: tombiddulph
      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/PropertyResolvers.Attributes.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
          dotnet nuget push "artifacts/PropertyResolvers.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
      - name: Tag
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: PropertyResolvers ${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, '-') }}
          make_latest: ${{ contains(inputs.version, '-') && 'false' || 'true' }}
          body_path: docs/releases/2.5.0.md
          generate_release_notes: true
          files: artifacts/*.nupkg
